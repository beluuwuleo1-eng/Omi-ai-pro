<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #1e1e1e;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #ffffff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .counter {
      font-size: 0.9rem;
      color: #aaa;
    }

    .btn-key {
      background-color: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .btn-key:hover {
      background-color: #1d4ed8;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      align-self: flex-start;
      background-color: #2a2a2a;
      color: #e0e0e0;
      border-bottom-left-radius: 2px;
    }

    .input-container {
      padding: 16px 24px;
      background-color: #1e1e1e;
      border-top: 1px solid #333;
      display: flex;
      gap: 12px;
    }

    input[type="text"] {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #2563eb;
    }

    button.send-btn {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    button.send-btn:disabled {
      background-color: #444;
      cursor: not-allowed;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .modal {
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #333;
    }

    .modal h3 {
      color: #fff;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn-secondary {
      background-color: #444;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">AI Assistant</div>
    <div class="header-right">
      <div class="counter" id="usageCounter">Messages remaining: 10</div>
      <button class="btn-key" onclick="openKeyModal()">Have a key?</button>
    </div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="message assistant">Hello! How can I assist you today?</div>
  </div>

  <div class="input-container">
    <input type="text" id="userInput" placeholder="Type a message..." onkeydown="handleKeyPress(event)">
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <!-- Key Entry Modal -->
  <div class="modal-overlay" id="keyModal">
    <div class="modal">
      <h3>Enter Secret Key</h3>
      <input type="text" id="keyInput" placeholder="Enter key here...">
      <div class="modal-buttons">
        <button class="btn-secondary" onclick="closeKeyModal()">Cancel</button>
        <button class="btn-key" onclick="submitKey()">Submit</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const SYSTEM_API_KEY = "AQ.Ab8RN6Iv9LqV2LB3RovMznMfJGshvcZkE6z_7fd_Roif-aI_vg";
    const MODEL_NAME = "gemini-3-flash-preview";
    const ALLOWED_KEYS = ["ncarvis suphannapoom", "femboy"];
    const MAX_FREE_MESSAGES = 10;

    // State management using localStorage
    let messageCount = parseInt(localStorage.getItem('ai_msg_count') || '0', 10);
    let hasValidKey = localStorage.getItem('ai_has_key') === 'true';

    // DOM Elements
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const usageCounter = document.getElementById('usageCounter');
    const keyModal = document.getElementById('keyModal');
    const keyInput = document.getElementById('keyInput');

    function updateCounterDisplay() {
      if (hasValidKey) {
        usageCounter.textContent = "Access: Unlimited (Key Active)";
        usageCounter.style.color = "#4ade80";
      } else {
        const remaining = Math.max(0, MAX_FREE_MESSAGES - messageCount);
        usageCounter.textContent = `Messages remaining: ${remaining}`;
        usageCounter.style.color = remaining === 0 ? "#f87171" : "#aaa";
        
        if (remaining === 0) {
          userInput.disabled = true;
          sendBtn.disabled = true;
          userInput.placeholder = "Free limit reached. Click 'Have a key?' to continue.";
        }
      }
    }

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', role);
      msgDiv.textContent = text;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (!hasValidKey && messageCount >= MAX_FREE_MESSAGES) {
        alert("You have reached your limit of 10 free messages. Please enter a valid key to continue.");
        return;
      }

      appendMessage('user', text);
      userInput.value = '';
      sendBtn.disabled = true;

      // Increment counter for standard users
      if (!hasValidKey) {
        messageCount++;
        localStorage.setItem('ai_msg_count', messageCount);
        updateCounterDisplay();
      }

      // Placeholder bot response while waiting
      const loadingDiv = document.createElement('div');
      loadingDiv.classList.add('message', 'assistant');
      loadingDiv.textContent = "Thinking...";
      chatContainer.appendChild(loadingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${SYSTEM_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          loadingDiv.textContent = data.candidates[0].content.parts[0].text;
        } else {
          loadingDiv.textContent = "Error: Could not retrieve a response.";
        }
      } catch (err) {
        loadingDiv.textContent = "API Error: Failed to connect to Gemini.";
      } finally {
        if (hasValidKey || messageCount < MAX_FREE_MESSAGES) {
          sendBtn.disabled = false;
        }
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    // Modal Control Functions
    function openKeyModal() {
      keyModal.style.display = 'flex';
      keyInput.value = '';
      keyInput.focus();
    }

    function closeKeyModal() {
      keyModal.style.display = 'none';
    }

    function submitKey() {
      const enteredKey = keyInput.value.trim();
      if (ALLOWED_KEYS.includes(enteredKey)) {
        hasValidKey = true;
        localStorage.setItem('ai_has_key', 'true');
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.placeholder = "Type a message...";
        updateCounterDisplay();
        closeKeyModal();
        alert("Key accepted! Unlimited access granted.");
      } else {
        alert("Invalid key. Please try again.");
      }
    }

    // Initialize UI on load
    updateCounterDisplay();
  </script>
</body>
  </html>
